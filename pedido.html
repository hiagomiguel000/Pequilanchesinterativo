<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="comum.css">
<style>
/* Layout: cabeçalho escuro com número do pedido, linha do tempo do status, pagamento e itens em blocos. */
.top { background: var(--head); color: var(--head-ink); }
.top .wrap { padding-block: 20px 22px; display: grid; gap: 14px; }
.top-row { display: flex; align-items: center; gap: 12px; }
.top-row .mark { width: 42px; height: 42px; font-size: 18px; }
.loja { font-weight: 700; color: var(--head-muted); font-size: 14px; }
.numero { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 9vw, 42px); line-height: 1; margin: 0; }
.agora { font-size: 18px; font-weight: 700; margin: 0; }
.atualizado { font-size: 13px; color: var(--head-muted); margin: 0; }

.corpo { padding-block: 18px 40px; display: grid; gap: 14px; }

/* Linha do tempo do pedido */
.passos { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.passo { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; position: relative; padding-bottom: 18px; }
.passo:last-child { padding-bottom: 0; }
.passo::before { content: ""; position: absolute; left: 13px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
.passo:last-child::before { display: none; }
.passo.feito::before { background: var(--dark); }
.bola { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); box-sizing: border-box; display: grid; place-items: center; color: var(--on-dark); }
.passo.feito .bola { background: var(--dark); border-color: var(--dark); }
.passo.atual .bola { border-color: var(--dark); box-shadow: 0 0 0 4px var(--pequi-soft); }
.passo-nome { font-weight: 700; padding-top: 3px; }
.passo:not(.feito):not(.atual) .passo-nome { color: var(--muted); font-weight: 500; }
.passo-sub { font-size: 13px; color: var(--muted); }

.cancelado { background: var(--danger-soft); color: var(--danger); border-radius: 14px; padding: 14px 16px; font-weight: 600; }

.itens { display: grid; gap: 8px; }
.it { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.it span:first-child { min-width: 0; }
.it small { display: block; color: var(--muted); font-size: 13px; }
.top-row .mark { overflow: hidden; }
.top-row .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
.totais { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
.totais div { display: flex; justify-content: space-between; gap: 12px; }
.totais .grand { color: var(--ink); font-weight: 800; font-size: 18px; }

.pago-ok { display: flex; align-items: center; gap: 10px; background: var(--ok-soft); color: var(--ok-ink); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.acoes { display: grid; gap: 8px; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="mark" id="mark" aria-hidden="true"></div>
      <div>
        <div class="loja" id="loja-nome">Carregando…</div>
        <h1 class="numero" id="numero">Pedido</h1>
      </div>
    </div>
    <div>
      <p class="agora" id="agora" aria-live="polite"></p>
      <p class="atualizado" id="atualizado"></p>
    </div>
  </div>
</header>

<main class="wrap corpo" id="corpo">
  <div class="state" id="estado">Buscando seu pedido…</div>

  <section class="block" id="b-status" hidden aria-labelledby="h-status">
    <h3 id="h-status">Andamento</h3>
    <ol class="passos" id="passos"></ol>
    <div class="cancelado" id="cancelado" hidden>Este pedido foi cancelado pela lanchonete. Se tiver dúvida, fale com ela pelo WhatsApp.</div>
  </section>

  <section class="block" id="b-pag" hidden aria-labelledby="h-pag">
    <h3 id="h-pag">Pagamento</h3>
    <div id="pag-conteudo"></div>
  </section>

  <section class="block" id="b-itens" hidden aria-labelledby="h-itens">
    <h3 id="h-itens">Itens</h3>
    <div class="itens" id="itens"></div>
    <div class="totais" id="totais"></div>
  </section>

  <div class="acoes" id="acoes" hidden>
    <a class="btn big" id="whats" href="#" target="_blank" rel="noopener">Falar com a lanchonete</a>
    <a class="btn big ghost" id="novo" href="index.html">Fazer outro pedido</a>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* Configuração e funções compartilhadas pelas três páginas. */
window.APP = (function () {
  // Projeto Supabase (a chave publicável é feita para ficar no site; a segurança está nas regras do banco).
  var SUPABASE_URL = 'https://czyvckoqxoyzgqhqluwt.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_jAuXfCr_OYiel6NBnkPJNA_7UmedRk8';
  var LOJA_PADRAO = 'pequi-lanches';

  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function $(id) { return document.getElementById(id); }
  function fmt(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function slugAtual() {
    var p = new URLSearchParams(location.search).get('loja');
    return p && /^[a-z0-9-]{3,40}$/.test(p) ? p : LOJA_PADRAO;
  }
  function iniciais(nome) {
    var p = String(nome || '').trim().split(/\s+/);
    return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }
  function numBonito(d) {
    d = String(d || '').replace(/\D/g, '');
    if (d.length === 13 && d.indexOf('55') === 0) return '(' + d.slice(2, 4) + ') ' + d.slice(4, 5) + ' ' + d.slice(5, 9) + '-' + d.slice(9);
    if (d.length === 12 && d.indexOf('55') === 0) return '(' + d.slice(2, 4) + ') ' + d.slice(4, 8) + '-' + d.slice(8);
    if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 3) + ' ' + d.slice(3, 7) + '-' + d.slice(7);
    return d;
  }
  function linkWhats(numero, texto) {
    var d = String(numero || '').replace(/\D/g, '');
    if (d.length === 10 || d.length === 11) d = '55' + d;
    return 'https://wa.me/' + d + (texto ? '?text=' + encodeURIComponent(texto) : '');
  }

  // ---------- Pix (padrão BR Code do Banco Central) ----------
  function tlv(id, valor) { return id + String(valor.length).padStart(2, '0') + valor; }
  function crc16(s) {
    var crc = 0xFFFF;
    for (var i = 0; i < s.length; i++) {
      crc ^= s.charCodeAt(i) << 8;
      for (var j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  }
  function limpaPix(s, max) { return semAcento(s).toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim().slice(0, max); }
  function pixPayload(loja, valor, txid) {
    var conta = tlv('00', 'BR.GOV.BCB.PIX') + tlv('01', loja.pix_chave);
    var p = tlv('00', '01') + tlv('26', conta) + tlv('52', '0000') + tlv('53', '986') +
      tlv('54', Number(valor).toFixed(2)) + tlv('58', 'BR') +
      tlv('59', limpaPix(loja.pix_nome || loja.nome, 25) || 'LOJA') +
      tlv('60', limpaPix(loja.pix_cidade || 'BRASIL', 15) || 'BRASIL') +
      tlv('62', tlv('05', String(txid || '***').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***')) + '6304';
    return p + crc16(p);
  }
  function qrSvg(texto) {
    if (typeof window.qrcode !== 'function') return '';
    var qr = window.qrcode(0, 'M');
    qr.addData(texto);
    qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 8, scalable: true });
  }

  // ---------- Aviso rápido na tela ----------
  var timer;
  function aviso(texto) {
    var el = $('toast');
    if (!el) return;
    el.textContent = texto;
    el.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(function () { el.hidden = true; }, 3400);
  }
  function copiar(texto, campoReserva, msgOk) {
    var reserva = function () {
      if (!campoReserva) return;
      campoReserva.hidden = false;
      campoReserva.value = texto;
      campoReserva.focus();
      campoReserva.select();
      aviso('Texto selecionado. Toque e segure para copiar.');
    };
    try {
      navigator.clipboard.writeText(texto).then(function () { aviso(msgOk || 'Copiado.'); }, reserva);
    } catch (e) { reserva(); }
  }

  function guardar(chave, valor) { try { localStorage.setItem(chave, valor); } catch (e) {} }
  function ler(chave) { try { return localStorage.getItem(chave); } catch (e) { return null; } }

  // ---------- Contas e papéis ----------
  var DESTINO = { admin: 'admin.html', lojista: 'painel.html', cliente: 'minha-conta.html' };
  function voltaSegura(v) {
    return v && /^[a-z-]+\.html(\?[A-Za-z0-9=&%._-]*)?$/.test(v) ? v : null;
  }
  async function perfil() {
    var s = await db.auth.getSession();
    var u = s.data && s.data.session ? s.data.session.user : null;
    if (!u) return null;
    var r = await db.from('perfis').select('id, email, papel, nome, telefone, endereco, referencia').eq('id', u.id).maybeSingle();
    if (r.error) return { id: u.id, email: u.email, papel: 'cliente', erro: true };
    return r.data || { id: u.id, email: u.email, papel: 'cliente' };
  }
  // Garante login e papel certo; se não tiver, leva para a entrada ou para a área da pessoa.
  async function exigir(papeis) {
    var p = await perfil();
    var aqui = location.pathname.split('/').pop() + location.search;
    if (!p) { location.replace('entrar.html?volta=' + encodeURIComponent(aqui)); return null; }
    if (papeis && papeis.indexOf(p.papel) < 0) { location.replace(DESTINO[p.papel] || 'minha-conta.html'); return null; }
    return p;
  }
  async function sair(para) {
    await db.auth.signOut();
    location.href = para || 'entrar.html';
  }

  // ---------- Horário da loja (fuso de Tocantins) ----------
  var DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var DIAS_CURTOS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  function agoraLocal() {
    var p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Araguaina', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    var dia = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday);
    return { dia: dia, min: Number(p.hour) * 60 + Number(p.minute) };
  }
  function paraMin(h) { var m = /^(\d{1,2}):(\d{2})/.exec(h || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
  function faixa(horarios, dia) {
    var h = horarios && horarios[String(dia)];
    if (!h || typeof h !== 'object') return null;
    var a = paraMin(h.abre), f = paraMin(h.fecha);
    return a === null || f === null ? null : { abre: a, fecha: f, txtAbre: h.abre.slice(0, 5), txtFecha: h.fecha.slice(0, 5) };
  }
  function dentroDoHorario(horarios) {
    var t = agoraLocal(), hoje = faixa(horarios, t.dia), ontem = faixa(horarios, (t.dia + 6) % 7);
    if (hoje && ((hoje.fecha > hoje.abre && t.min >= hoje.abre && t.min < hoje.fecha) || (hoje.fecha <= hoje.abre && t.min >= hoje.abre))) return hoje;
    if (ontem && ontem.fecha <= ontem.abre && t.min < ontem.fecha) return ontem;
    return null;
  }
  function estadoLoja(l) {
    if (!l.ativa) return { aberta: false, texto: 'Indisponível no momento' };
    if (!l.abrir_auto) return { aberta: !!l.aberta, texto: l.aberta ? 'Aberto agora' : 'Fechado agora' };
    if (!l.aberta) return { aberta: false, texto: 'Pausado agora' };
    var f = dentroDoHorario(l.horarios || {});
    if (f) return { aberta: true, texto: 'Aberto agora · fecha às ' + f.txtFecha };
    var t = agoraLocal();
    for (var i = 0; i < 7; i++) {
      var d = (t.dia + i) % 7, fx = faixa(l.horarios || {}, d);
      if (!fx || (i === 0 && fx.abre <= t.min)) continue;
      return { aberta: false, texto: 'Fechado agora · abre ' + (i === 0 ? 'hoje' : i === 1 ? 'amanhã' : DIAS[d]) + ' às ' + fx.txtAbre };
    }
    return { aberta: false, texto: 'Fechado agora' };
  }

  // ---------- Fotos: reduz no celular antes de enviar ----------
  function reduzirImagem(arquivo, lado) {
    return new Promise(function (ok, erro) {
      var img = new Image(), url = URL.createObjectURL(arquivo);
      img.onload = function () {
        var fator = Math.min(1, (lado || 900) / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * fator); c.height = Math.round(img.height * fator);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? ok(b) : erro(new Error('Não foi possível ler a imagem.')); }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); erro(new Error('Arquivo de imagem inválido.')); };
      img.src = url;
    });
  }
  async function enviarFoto(lojaId, arquivo, prefixo, lado) {
    var blob = await reduzirImagem(arquivo, lado);
    var caminho = lojaId + '/' + prefixo + '-' + Date.now() + '.jpg';
    var r = await db.storage.from('fotos').upload(caminho, blob, { contentType: 'image/jpeg', upsert: true, cacheControl: '31536000' });
    if (r.error) throw r.error;
    return db.storage.from('fotos').getPublicUrl(caminho).data.publicUrl;
  }

  // ---------- Avisos de pedido novo (notificação no celular) ----------
  var VAPID_PUBLICO = 'BDamUn6Jzw564LwcyvPZUvCZyJne3ZhsbV6Bt9im4m-EgNjJuI8YhbBiTL4cc4l0RnKst-TQgmx_hXGHmpL5v6Q';
  function b64uParaBytes(s) {
    var b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
    return Uint8Array.from(b, function (c) { return c.charCodeAt(0); });
  }
  function avisosSuportados() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  async function inscricaoAtual() {
    if (!avisosSuportados()) return null;
    var reg = await navigator.serviceWorker.getRegistration();
    return reg ? reg.pushManager.getSubscription() : null;
  }
  async function ativarAvisos(lojaId) {
    if (!avisosSuportados()) throw new Error('Este navegador não aceita notificações. No iPhone, primeiro adicione o painel à Tela de Início.');
    var perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('As notificações foram bloqueadas. Libere nas configurações do navegador para este site.');
    var reg;
    try { reg = await navigator.serviceWorker.register('sw.js'); }
    catch (e) { throw new Error('Falta o arquivo sw.js no site. Envie ele junto com as outras páginas.'); }
    await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription() ||
      await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uParaBytes(VAPID_PUBLICO) });
    var j = sub.toJSON();
    var r = await db.rpc('inscrever_push', { p_loja: lojaId, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_url: location.href.split('#')[0] });
    if (r.error) throw r.error;
    return true;
  }
  async function desativarAvisos() {
    var sub = await inscricaoAtual();
    if (!sub) return;
    await db.rpc('cancelar_push', { p_endpoint: sub.endpoint });
    await sub.unsubscribe();
  }

  var STATUS = {
    recebido: 'Recebido', preparo: 'Em preparo', saiu: 'Saiu para entrega',
    pronto: 'Pronto para retirar', concluido: 'Concluído', cancelado: 'Cancelado'
  };
  var PAGAMENTO = { pix: 'Pix', dinheiro: 'Dinheiro', cartao: 'Cartão (maquininha)' };

  return {
    db: db, $: $, fmt: fmt, esc: esc, semAcento: semAcento, slugAtual: slugAtual, iniciais: iniciais,
    numBonito: numBonito, linkWhats: linkWhats, pixPayload: pixPayload, qrSvg: qrSvg,
    aviso: aviso, copiar: copiar, guardar: guardar, ler: ler, STATUS: STATUS, PAGAMENTO: PAGAMENTO,
    DESTINO: DESTINO, voltaSegura: voltaSegura, perfil: perfil, exigir: exigir, sair: sair,
    DIAS: DIAS, DIAS_CURTOS: DIAS_CURTOS, estadoLoja: estadoLoja, enviarFoto: enviarFoto,
    avisosSuportados: avisosSuportados, inscricaoAtual: inscricaoAtual, ativarAvisos: ativarAvisos, desativarAvisos: desativarAvisos
  };
})();

</script>
<script>
(function () {
  var A = window.APP, $ = A.$, fmt = A.fmt, esc = A.esc;
  var token = new URLSearchParams(location.search).get('t') || '';
  var pedido = null, pixFeito = '', ultimoStatus = null, timer = null;
  var CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function passosDe(p) {
    var fim = p.modo === 'entrega' ? ['saiu', 'Saiu para entrega', 'O entregador está a caminho.'] : ['pronto', 'Pronto para retirar', 'Pode buscar no balcão.'];
    return [
      ['recebido', 'Pedido recebido', 'A lanchonete já recebeu seu pedido.'],
      ['preparo', 'Em preparo', 'Seu pedido está sendo feito.'],
      fim,
      ['concluido', p.modo === 'entrega' ? 'Entregue' : 'Retirado', 'Bom apetite!']
    ];
  }
  var FRASE = {
    recebido: 'Recebemos seu pedido.', preparo: 'Seu pedido está sendo preparado.',
    saiu: 'Seu pedido saiu para entrega.', pronto: 'Seu pedido está pronto para retirar.',
    concluido: 'Pedido concluído. Bom apetite!', cancelado: 'Pedido cancelado.'
  };

  function render() {
    var p = pedido, L = p.loja;
    document.title = 'Pedido #' + p.numero + ' · ' + L.nome;
    $('mark').innerHTML = L.logo_url ? '<img src="' + esc(L.logo_url) + '" alt="">' : esc(A.iniciais(L.nome));
    $('loja-nome').textContent = L.nome;
    $('numero').textContent = 'Pedido #' + p.numero;
    $('agora').textContent = FRASE[p.status] || '';
    $('atualizado').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' · esta página se atualiza sozinha';
    $('estado').hidden = true;

    // Andamento
    var cancel = p.status === 'cancelado';
    $('cancelado').hidden = !cancel;
    $('passos').hidden = cancel;
    if (!cancel) {
      var lista = passosDe(p), idx = lista.findIndex(function (s) { return s[0] === p.status; });
      $('passos').innerHTML = lista.map(function (s, i) {
        var cls = i < idx || p.status === 'concluido' ? 'feito' : i === idx ? 'atual' : '';
        return '<li class="passo ' + cls + '"><span class="bola">' + (cls === 'feito' ? CHECK : '') + '</span>' +
          '<div><div class="passo-nome">' + esc(s[1]) + '</div>' + (i === idx && p.status !== 'concluido' ? '<div class="passo-sub">' + esc(s[2]) + '</div>' : '') + '</div></li>';
      }).join('');
    }
    $('b-status').hidden = false;

    // Pagamento
    var pc = $('pag-conteudo');
    if (p.pago) {
      pc.innerHTML = '<div class="pago-ok">' + CHECK + ' Pagamento confirmado pela lanchonete</div>';
      pixFeito = '';
    } else if (p.pagamento === 'pix' && !cancel && L.pix_chave) {
      if (pixFeito !== String(p.total)) {
        var codigo = A.pixPayload(L, p.total, 'PED' + p.numero);
        var svg = A.qrSvg(codigo);
        pc.innerHTML = '<div class="pix">' +
          '<div class="pix-qr" role="img" aria-label="QR Code do Pix">' + (svg || 'Use o código copia e cola.') + '</div>' +
          '<div class="pix-info"><p class="pix-label">Pix · valor exato</p><p class="pix-val">' + fmt(p.total) + '</p>' +
          '<p class="pix-key">Chave: ' + esc(L.pix_chave) + '</p>' +
          '<button type="button" class="btn" id="pix-copy">Copiar código Pix</button></div>' +
          '<input class="copia" id="pix-code" type="text" readonly aria-label="Código Pix copia e cola" hidden>' +
          '<p class="pix-note">Pague pelo app do seu banco. A lanchonete confirma o pagamento e esta página mostra quando cair.</p></div>';
        $('pix-copy').addEventListener('click', function () { A.copiar(codigo, $('pix-code'), 'Código Pix copiado.'); });
        pixFeito = String(p.total);
      }
    } else {
      pixFeito = '';
      var como = A.PAGAMENTO[p.pagamento] || p.pagamento;
      pc.innerHTML = '<p class="hint" style="font-size:15px;color:var(--ink)">' + esc(como) + (p.modo === 'entrega' ? ' na entrega.' : ' na retirada.') + '</p>';
    }
    $('b-pag').hidden = false;

    // Itens
    $('itens').innerHTML = p.itens.map(function (i) {
      var extra = [(i.opcoes || []).map(function (o) { return o.nome; }).join(', '), i.obs ? 'Obs.: ' + i.obs : ''].filter(Boolean).join(' · ');
      return '<div class="it"><span>' + i.quantidade + 'x ' + esc(i.nome) + (extra ? '<small>' + esc(extra) + '</small>' : '') + '</span><span>' + fmt(i.quantidade * i.preco_unit) + '</span></div>';
    }).join('');
    $('totais').innerHTML = '<div><span>Subtotal</span><span>' + fmt(p.subtotal) + '</span></div>' +
      (p.modo === 'entrega' ? '<div><span>Entrega</span><span>' + fmt(p.taxa) + '</span></div>' : '<div><span>Retirada no balcão</span><span>Sem taxa</span></div>') +
      '<div class="grand"><span>Total</span><span>' + fmt(p.total) + '</span></div>';
    $('b-itens').hidden = false;

    // Ações
    var w = $('whats');
    w.hidden = !L.whatsapp;
    if (L.whatsapp) w.href = A.linkWhats(L.whatsapp, 'Olá! Sobre o meu pedido #' + p.numero + '.');
    $('novo').href = 'index.html?loja=' + encodeURIComponent(L.slug);
    $('acoes').hidden = false;

    if (ultimoStatus && ultimoStatus !== p.status) A.aviso(FRASE[p.status] || 'Pedido atualizado.');
    ultimoStatus = p.status;
  }

  async function buscar() {
    if (!/^[0-9a-f-]{36}$/i.test(token)) {
      $('estado').innerHTML = '<strong>Link de pedido inválido.</strong><a class="btn" href="index.html">Ver o cardápio</a>';
      return;
    }
    var r = await A.db.rpc('acompanhar_pedido', { p_token: token });
    if (r.error) {
      if (!pedido) $('estado').innerHTML = '<strong>Não foi possível carregar seu pedido.</strong><span>Confira sua internet. Vamos tentar de novo sozinhos.</span>';
      return agendar(15000);
    }
    if (!r.data) {
      $('estado').innerHTML = '<strong>Não encontramos este pedido.</strong><a class="btn" href="index.html">Ver o cardápio</a>';
      return;
    }
    pedido = r.data;
    render();
    var fim = pedido.status === 'concluido' || pedido.status === 'cancelado';
    if (!fim || !pedido.pago) agendar(fim ? 30000 : 8000);
  }
  function agendar(ms) { clearTimeout(timer); timer = setTimeout(buscar, ms); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) buscar(); });

  buscar();
})();
</script>
</body>
</html>
