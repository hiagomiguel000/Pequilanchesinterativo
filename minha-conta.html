<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Minha conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="comum.css">
<style>
/* Layout: cabeçalho escuro com o nome, depois pedidos (o que a pessoa mais procura) e dados salvos. */
.corpo { padding-block: 18px 48px; display: grid; gap: 18px; }
.atalhos { display: flex; gap: 8px; flex-wrap: wrap; }
.lista { display: grid; gap: 10px; }
.ped { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); background: var(--bg); }
.ped:hover { border-color: var(--muted); }
.ped-loja { font-weight: 800; }
.ped-info { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ped-total { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.ped .pill { justify-self: end; }
h2.sec { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
</style>
</head>
<body>

<header class="topo">
  <div class="wrap linha">
    <div class="quem">
      <div class="mark sm" id="mark" aria-hidden="true"></div>
      <div style="min-width:0"><strong id="nome">Minha conta</strong><small id="email"></small></div>
    </div>
    <div class="acoes-topo"><button class="btn" type="button" id="sair">Sair</button></div>
  </div>
</header>

<main class="wrap corpo" id="corpo" hidden>
  <div class="atalhos" id="atalhos">
    <a class="btn" id="fazer-pedido" href="index.html">Fazer um pedido</a>
  </div>

  <section class="block" aria-labelledby="h-pedidos">
    <h2 class="sec" id="h-pedidos">Meus pedidos</h2>
    <div class="lista" id="pedidos"><div class="state">Carregando…</div></div>
  </section>

  <section class="block" aria-labelledby="h-dados">
    <h2 class="sec" id="h-dados">Meus dados</h2>
    <p class="hint">Usamos estes dados para preencher seu pedido sozinho. Você pode mudar quando quiser.</p>
    <form id="form-dados" class="grid2" novalidate>
      <div class="field"><label for="d-nome">Nome</label><input id="d-nome" type="text" autocomplete="name"></div>
      <div class="field"><label for="d-tel">WhatsApp</label><input id="d-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(63) 9 9999-9999"></div>
      <div class="field"><label for="d-end">Endereço</label><input id="d-end" type="text" autocomplete="street-address" placeholder="Rua, número e bairro"></div>
      <div class="field"><label for="d-ref">Ponto de referência</label><input id="d-ref" type="text"></div>
      <div><button class="btn" type="submit" id="salvar">Salvar dados</button></div>
    </form>
  </section>
</main>

<div class="state" id="carregando">Carregando…</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="comum.js"></script>
<script>
(async function () {
  var A = window.APP, $ = A.$, fmt = A.fmt, esc = A.esc, db = A.db;
  var eu = await A.exigir(null);
  if (!eu) return;

  $('nome').textContent = eu.nome || 'Minha conta';
  $('email').textContent = eu.email || '';
  $('mark').textContent = A.iniciais(eu.nome || eu.email || '?');
  $('d-nome').value = eu.nome || '';
  $('d-tel').value = eu.telefone || '';
  $('d-end').value = eu.endereco || '';
  $('d-ref').value = eu.referencia || '';
  if (eu.papel === 'lojista') $('atalhos').insertAdjacentHTML('beforeend', '<a class="btn soft" href="painel.html">Painel da lanchonete</a>');
  if (eu.papel === 'admin') $('atalhos').insertAdjacentHTML('beforeend', '<a class="btn soft" href="admin.html">Administração</a>');
  $('carregando').hidden = true;
  $('corpo').hidden = false;

  $('sair').addEventListener('click', function () { A.sair('index.html'); });

  $('form-dados').addEventListener('submit', async function (e) {
    e.preventDefault();
    var b = $('salvar');
    b.disabled = true;
    var r = await db.from('perfis').update({
      nome: $('d-nome').value.trim() || null, telefone: $('d-tel').value.trim() || null,
      endereco: $('d-end').value.trim() || null, referencia: $('d-ref').value.trim() || null
    }).eq('id', eu.id);
    b.disabled = false;
    if (r.error) return A.aviso('Não foi possível salvar. Tente de novo.');
    $('nome').textContent = $('d-nome').value.trim() || 'Minha conta';
    A.aviso('Dados salvos.');
  });

  var SELO = { recebido: 'warn', preparo: 'warn', saiu: 'ok', pronto: 'ok', concluido: 'off', cancelado: 'bad' };
  var r = await db.from('pedidos')
    .select('numero, status, total, created_at, token, lojas(nome, slug)')
    .eq('cliente_id', eu.id).order('created_at', { ascending: false }).limit(50);
  if (r.error) { $('pedidos').innerHTML = '<p class="vazio">Não foi possível carregar seus pedidos.</p>'; return; }
  if (!r.data.length) { $('pedidos').innerHTML = '<p class="vazio">Você ainda não fez pedidos com esta conta.</p>'; return; }
  var ultimaLoja = r.data[0].lojas && r.data[0].lojas.slug;
  if (ultimaLoja) $('fazer-pedido').href = 'index.html?loja=' + encodeURIComponent(ultimaLoja);
  $('pedidos').innerHTML = r.data.map(function (p) {
    var d = new Date(p.created_at);
    return '<a class="ped" href="pedido.html?t=' + encodeURIComponent(p.token) + '">' +
      '<span class="ped-loja">' + esc(p.lojas ? p.lojas.nome : 'Lanchonete') + '</span>' +
      '<span class="ped-total">' + fmt(p.total) + '</span>' +
      '<span class="ped-info">Pedido #' + p.numero + ' · ' + d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '</span>' +
      '<span class="pill ' + (SELO[p.status] || 'off') + '">' + esc(A.STATUS[p.status] || p.status) + '</span></a>';
  }).join('');
})();
</script>
</body>
</html>
